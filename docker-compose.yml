services:
  postgres:
    image: postgres:16-alpine
    container_name: ai_orchestrator_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_orchestrator
      POSTGRES_USER: orchestrator
      POSTGRES_PASSWORD: orchestrator_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestrator -d ai_orchestrator"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
